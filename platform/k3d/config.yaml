apiVersion: k3d.io/v1alpha5
kind: Simple

metadata:
  name: platform-demo

servers: 1
agents: 1

kubeAPI:
  host: "localhost"
  hostIP: "127.0.0.1"
  hostPort: "6445"

ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer

  - port: 8443:443
    nodeFilters:
      - loadbalancer

options:
  k3d:
    wait: true
    timeout: "120s"

  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true