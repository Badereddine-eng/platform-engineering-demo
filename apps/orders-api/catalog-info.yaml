apiVersion: backstage.io/v1alpha1
kind: Component

metadata:
  name: orders-api
  title: Orders API
  description: Orders management service used for the Platform Engineering demo

  annotations:
    github.com/project-slug: Badereddine-eng/platform-engineering-demo
    backstage.io/kubernetes-label-selector: 'app.kubernetes.io/name=orders-api'
    backstage.io/kubernetes-namespace: orders
  
  tags:
    - java
    - spring-boot
    - kubernetes
    - gitops

  links:
    - url: http://orders.localhost:8080/orders
      title: Orders API
      icon: web

    - url: https://github.com/Badereddine-eng/platform-engineering-demo
      title: Source Code
      icon: github

spec:
  type: service
  lifecycle: production
  owner: orders-team
  system: ecommerce-platform
  providesApis:
    - orders-api

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: orders-api
  title: Orders REST API
  description: REST API exposed by the Orders service
spec:
  type: openapi
  lifecycle: production
  owner: orders-team
  system: ecommerce-platform
  definition: |
    openapi: 3.0.3
    info:
      title: Orders API
      version: 1.0.0
    servers:
      - url: http://orders.localhost:8080
    paths:
      /health:
        get:
          summary: Health check
          responses:
            '200':
              description: Service is healthy
      /orders:
        get:
          summary: List orders
          responses:
            '200':
              description: Orders returned successfully