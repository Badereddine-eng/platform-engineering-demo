apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: orders-api
  namespace: orders
  labels:
    app.kubernetes.io/name: orders-api
    app.kubernetes.io/part-of: platform-engineering-demo

spec:
  ingressClassName: traefik

  rules:
    - host: orders.localhost

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: orders-api
                port:
                  number: 80