apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: orders-api
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Badereddine-eng/platform-engineering-demo.git
    targetRevision: main
    path: gitops/apps/orders-api

  destination:
    server: https://kubernetes.default.svc
    namespace: orders

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true