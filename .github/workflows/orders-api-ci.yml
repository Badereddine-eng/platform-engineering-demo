name: Orders API - CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/orders-api/**"
      - ".github/workflows/orders-api-ci.yml"

  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: badereddine-eng/orders-api

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        working-directory: apps/orders-api
        run: mvn --batch-mode clean verify

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: apps/orders-api
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Update GitOps manifest
        shell: bash
        run: |
          IMAGE="ghcr.io/${{ env.IMAGE_NAME }}:${GITHUB_SHA}"

          sed -i \
            "s|^\([[:space:]]*\)image: .*|\1image: ${IMAGE}|" \
            gitops/apps/orders-api/deployment.yaml

          echo "New image:"
          grep "image:" gitops/apps/orders-api/deployment.yaml

      - name: Commit GitOps change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gitops/apps/orders-api/deployment.yaml

          if git diff --cached --quiet; then
            echo "No GitOps change required."
            exit 0
          fi

          git commit -m "chore(gitops): deploy orders-api ${GITHUB_SHA::7}"

          git pull --rebase origin main
          git push origin HEAD:main